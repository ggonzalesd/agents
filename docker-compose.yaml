services:
  game-app:
    image: node:24.6.0-bookworm
    working_dir: /app
    env_file: .env
    restart: unless-stopped
    volumes:
      - .:/app
      - game-node-modules:/app/node_modules
    ports:
      - '${PORT}:${PORT}'
    depends_on:
      - game-postgresql
    environment:
      DB_HOST: game-postgresql
      DB_URL: 'postgresql://${DB_USER}:${DB_PASSWORD}@game-postgresql:5432/${DB_NAME}?schema=public'
    command: >
      sh -c "corepack enable && corepack prepare pnpm@latest --activate && pnpm server:start"

  game-postgresql:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: $DB_USER
      POSTGRES_PASSWORD: $DB_PASSWORD
      POSTGRES_DB: $DB_NAME
    ports:
      - '$DB_PORT:5432'
    volumes:
      - game-postgresql-data:/var/lib/postgresql/data

  game-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - '127.0.0.1:${S3_PORT}:9000'
      - '127.0.0.1:${S3_CONSOLE_PORT}:9001'
    volumes:
      - game-minio-data:/data
      - game-minio-config:/root/.minio
    command: server /data --console-address ":9001"

volumes:
  game-postgresql-data:
  game-minio-data:
  game-minio-config:
  game-node-modules:
